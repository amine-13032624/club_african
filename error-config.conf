<!-- Fichier de configuration pour les erreurs personnalisées d'Apache -->
<!-- À placer dans le répertoire du site -->

<!-- 404 Not Found -->
<IfModule mod_alias.c>
    ErrorDocument 400 /club-sportif/error.php?code=400
    ErrorDocument 401 /club-sportif/error.php?code=401
    ErrorDocument 403 /club-sportif/error.php?code=403
    ErrorDocument 404 /club-sportif/error.php?code=404
    ErrorDocument 500 /club-sportif/error.php?code=500
    ErrorDocument 502 /club-sportif/error.php?code=502
    ErrorDocument 503 /club-sportif/error.php?code=503
</IfModule>
